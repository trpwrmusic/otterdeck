  <circle cx="26.6" cy="43.4" r=".75" fill="#9a7a5e"/>
  <circle cx="39.4" cy="40.4" r=".75" fill="#9a7a5e"/>
  <circle cx="40.4" cy="42.8" r=".75" fill="#9a7a5e"/>
  <circle cx="37.4" cy="43.4" r=".75" fill="#9a7a5e"/>
